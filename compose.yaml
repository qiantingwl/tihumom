services:
  pelican:
    image: pelican-mama:local
    build:
      context: .
      args:
        VITE_PUBLIC_ORIGIN: ${VITE_PUBLIC_ORIGIN:-https://www.tihu.mom}
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 8988
      DATA_DIR: /app/data
    ports:
      - '127.0.0.1:8988:8988'
    volumes:
      - ./data:/app/data
    shm_size: 512mb
    stop_grace_period: 25s
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          'fetch("http://127.0.0.1:8988/api/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
